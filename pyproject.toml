[tool.black]
line-length = 88
target-version = ['py312']
skip-string-normalization = true
skip-magic-trailing-comma = true
use-tabs = true

[tool.isort]
profile = "black"
force_single_line = false
case_sensitive = true
combine_as_imports = true
order_by_type = true
force_sort_within_sections = true
line_length = 120
indent = "\t"
lines_between_types = 1
lines_after_imports = 1 
sort_order = "natural"

[tool.ruff]
line-length = 120
indent-width = 1
target-version = "py312"

[tool.ruff.format]
quote-style = "preserve"
indent-style = "tab"
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["W191"]

[tool.pyright]
include = ["."]
pythonVersion = "3.12"
typeCheckingMode = "basic"
